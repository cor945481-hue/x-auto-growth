name: X Niche & Trend Watcher 24/7

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lancer la veille tendance et notifications
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node bot.js
      - name: Sauvegarder l'historique
        run: |
          git config user.name "X-Growth-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git commit -m "Update seen trends" || exit 0
          git push
